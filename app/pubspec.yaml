name: orchardtab
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  magenta_music:
    path: ../packages/magenta_music
  orchard_engine:
    path: ../engine
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/GeneralUser-GS.sf2
    - assets/GeneralUser-GS-LICENSE.txt

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: false
  min_sdk_android: 27
  adaptive_icon_background: "#262D31"
  adaptive_icon_foreground: assets/icon/foreground.png
  macos:
    generate: true
    image_path: assets/icon/icon_rounded.png
