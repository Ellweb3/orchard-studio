[package]
name = "orchard_engine"
version = "0.1.0"
edition = "2024"
description = "Orchard Studio audio engine (Rust port of src/engine) for the Flutter app"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
mp3lame-encoder = "0.3.0"
rtrb = "0.4.1"
rustysynth = "1.3.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
