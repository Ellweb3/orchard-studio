name: magenta_music
description: >-
  Google Magenta music models (DrumsRNN, MelodyRNN, ImprovRNN, MusicVAE) for
  Dart and Flutter, running on-device through a pure Rust port. No ML runtime.
version: 0.1.0
repository: https://github.com/Ellweb3/orchard-studio/tree/flutter-rust/packages/magenta_music
publish_to: none
topics: [music, midi, magenta, ai, rust]

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.2.0
  ffi: ^2.1.0
  hooks: ^2.1.0
  native_toolchain_rust: ^1.1.1

dev_dependencies:
  test: ^1.25.0
